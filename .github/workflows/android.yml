name: Android build
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', 'scripts/**', '.github/workflows/android.yml' ]
  pull_request:
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Inter font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip -o /tmp/inter.zip
          mkdir -p /tmp/inter-fonts
          unzip -j -o /tmp/inter.zip 'extras/ttf/Inter-Regular.ttf' 'extras/ttf/Inter-Medium.ttf' 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Bold.ttf' -d /tmp/inter-fonts
          mv /tmp/inter-fonts/Inter-Regular.ttf app/src/main/res/font/inter_regular.ttf
          mv /tmp/inter-fonts/Inter-Medium.ttf app/src/main/res/font/inter_medium.ttf
          mv /tmp/inter-fonts/Inter-SemiBold.ttf app/src/main/res/font/inter_semibold.ttf
          mv /tmp/inter-fonts/Inter-Bold.ttf app/src/main/res/font/inter_bold.ttf
      - name: Validate shared hymn data
        run: python3 scripts/validate_hymns.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
