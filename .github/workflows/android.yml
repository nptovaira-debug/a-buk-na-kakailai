name: Android build
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', 'scripts/**', '.github/workflows/android.yml' ]
  pull_request:
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate shared hymn data
        run: python3 scripts/validate_hymns.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
