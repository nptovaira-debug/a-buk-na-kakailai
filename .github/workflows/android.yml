name: Android build
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', 'scripts/**', '.github/workflows/android.yml' ]
  pull_request:
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle Inter font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip -o /tmp/inter.zip
          mkdir -p /tmp/inter-fonts
          unzip -j -o /tmp/inter.zip 'extras/ttf/Inter-Regular.ttf' 'extras/ttf/Inter-Medium.ttf' 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Bold.ttf' -d /tmp/inter-fonts
          mv /tmp/inter-fonts/Inter-Regular.ttf app/src/main/res/font/inter_regular.ttf
          mv /tmp/inter-fonts/Inter-Medium.ttf app/src/main/res/font/inter_medium.ttf
          mv /tmp/inter-fonts/Inter-SemiBold.ttf app/src/main/res/font/inter_semibold.ttf
          mv /tmp/inter-fonts/Inter-Bold.ttf app/src/main/res/font/inter_bold.ttf
      - name: Validate shared hymn data
        run: python3 scripts/validate_hymns.py
      - name: Prepare optional release signing key
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Release signing credentials found; release bundle will be signed."
          else
            echo "Release signing credentials are not configured; release bundle will remain unsigned."
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build release Android App Bundle
        run: gradle --no-daemon bundleRelease
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
