name: Android build
on:
  push:
    branches: [ main, ui-polish-hymn-reading ]
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', 'scripts/**', '.github/workflows/android.yml' ]
  pull_request:
    paths: [ 'app/**', '*.gradle.kts', 'gradle.properties', 'shared-data/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle Plus Jakarta Sans font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -o app/src/main/res/font/plus_jakarta_sans.ttf
      - name: Validate shared hymn data
        run: python3 scripts/validate_hymns.py
      - name: Prepare optional release signing key
        continue-on-error: true
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            python3 - <<'PY'
          import base64, os, re
          value = os.environ["RELEASE_KEYSTORE_BASE64"]
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)
          value += "=" * ((-len(value)) % 4)
          output = os.path.join(os.environ["RUNNER_TEMP"], "upload-key.jks")
          with open(output, "wb") as f:
              f.write(base64.b64decode(value, validate=True))
          PY
            echo "Decoded keystore size: $(wc -c < "$RUNNER_TEMP/upload-key.jks") bytes"
            echo "Decoded keystore SHA-256: $(sha256sum "$RUNNER_TEMP/upload-key.jks" | cut -d' ' -f1)"
            if ! echo "abf959d5b58102e49de32b0e973da9869bd10971680f54f31390d2e6b042c57b  $RUNNER_TEMP/upload-key.jks" | sha256sum --check --status; then
              echo "::error::The Base64 secret does not match the original upload keystore. Replace RELEASE_KEYSTORE_BASE64 using the original keystore-base64.txt file."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD"; then
              echo "::error::The keystore file matches the original, but RELEASE_STORE_PASSWORD was rejected. Check it against the original signing-details.txt."
              exit 1
            fi
            if ! keytool -list -alias "$RELEASE_KEY_ALIAS" -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" >/dev/null; then
              echo "::error::RELEASE_KEY_ALIAS does not match the alias in the original keystore."
              exit 1
            fi
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Release keystore and alias validated; release bundle will be signed."
          else
            echo "Release signing credentials are not configured; release bundle will remain unsigned."
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build release Android App Bundle
        run: gradle --no-daemon bundleRelease
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a-buk-na-kakailai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
